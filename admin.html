<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'sha256-5/+CJSgpQ0SJJdqAo0mH6LK6qL4lTqSsvp1pin730CE='; connect-src 'self' https://*.supabase.co; img-src 'self' blob: https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>لوحة الإدارة - مطعم قلمون</title>
<style>
:root{--pri:#c2410c;--bg:#faf7f5;--sf:#fff;--tx:#2a1d16;--mu:#7a6a60;--bd:#eadfd8}
@media (prefers-color-scheme:dark){:root{--bg:#17110d;--sf:#221914;--tx:#f3ebe6;--mu:#b3a299;--bd:#3d2e25}}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial,sans-serif}
body{background:var(--bg);color:var(--tx);padding:16px}
.box{max-width:720px;margin:0 auto;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px}
h1{font-size:1.2rem;margin-bottom:12px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:.9rem}
.f{margin-top:10px}.f label{display:block;font-size:.85rem;font-weight:700;margin-bottom:4px}
.btn{padding:9px 14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:700;cursor:pointer}
.btn.d{background:#c0392b}.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.item{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:12px}
.item .f:first-child{margin-top:0}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.9rem}
.toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:200;font-size:.9rem;text-align:center}
.toast.ok{background:var(--pri);color:#fff}.toast.err{background:#c0392b;color:#fff}.toast[hidden]{display:none}
#pm{display:none}
.line{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.line input[type=number]{width:100px}.line select{width:auto}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
.thumb[hidden]{display:none}
input[type=file]{width:auto;border:0;padding:0;background:transparent}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}
input[type=color]{width:60px;height:38px;padding:2px}
.tabs{margin:10px 0}
.msg{color:#c0392b;font-size:.85rem;margin-top:8px;min-height:1em}
</style>
</head>
<body>
<div class="box" id="login">
  <h1>🔐 دخول المدير</h1>
  <div class="f"><label for="em">البريد الإلكتروني</label><input id="em" type="email" autocomplete="username"></div>
  <div class="f"><label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password"></div>
  <div class="f"><button class="btn" id="go" style="width:100%">دخول</button></div>
  <div class="msg" id="lm"></div>
</div>
<div class="box" id="panel" hidden>
  <div class="top"><h1>🛠 لوحة الإدارة</h1><div class="line"><button class="btn g" id="pwb">كلمة المرور</button><button class="btn g" id="out">خروج</button></div></div>
  <div id="pwbox" hidden>
    <div class="f"><label for="np">كلمة المرور الجديدة (12 خانة على الأقل)</label><input id="np" type="password" autocomplete="new-password"></div>
    <div class="f"><label for="np2">تأكيد كلمة المرور</label><input id="np2" type="password" autocomplete="new-password"></div>
    <div class="f"><button class="btn" id="pws">حفظ كلمة المرور</button></div>
  </div>
  <div class="line tabs"><button class="btn" id="tp">🍽 الأصناف</button><button class="btn g" id="ts">🎨 تصميم الموقع</button></div>
  <div class="msg" id="pm"></div>
  <div id="tabP"><button class="btn" id="add">+ منتج جديد</button><datalist id="cl"></datalist><div id="list"></div></div>
  <div id="tabS" hidden><div id="sform"></div><button class="btn" id="ssave" style="width:100%;margin-top:14px">حفظ تصميم الموقع</button></div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script>
'use strict';
const C = window.SHOP || {}, SB = C.SB_URL, KEY = C.SB_KEY;
let sess = null;
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
let tt = null;
const say = (t, ok) => {
  const x = $('toast'); x.textContent = t; x.className = 'toast ' + (ok ? 'ok' : 'err'); x.hidden = !t;
  clearTimeout(tt); if (t) tt = setTimeout(() => { x.hidden = true; }, ok ? 3500 : 9000);
};
const toNum = v => parseFloat(String(v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g, '.'));

function saveSess(d) {
  sess = {a: d.access_token, r: d.refresh_token, e: Date.now() + (d.expires_in - 60) * 1000};
  try { localStorage.setItem('qa_sess', JSON.stringify(sess)); } catch (e) {}
}
function auth(path, body) {
  return fetch(SB + '/auth/v1/' + path, {method: 'POST', headers: {apikey: KEY, 'Content-Type': 'application/json'}, body: JSON.stringify(body)})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
}
async function token() {
  if (!sess) throw new Error('سجّل الدخول من جديد');
  if (Date.now() > sess.e) {
    try { saveSess(await auth('token?grant_type=refresh_token', {refresh_token: sess.r})); }
    catch (e) { logout(); throw new Error('انتهت الجلسة، سجّل الدخول من جديد'); }
  }
  return sess.a;
}
async function api(path, opt = {}) {
  const t = await token();
  const r = await fetch(SB + '/rest/v1/' + path, {...opt, headers: {apikey: KEY, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json', Prefer: 'return=minimal'}});
  if (!r.ok) {
    let m = ''; try { const j = await r.json(); m = j.message || j.msg || ''; } catch (e) {}
    throw new Error('خطأ ' + r.status + (m ? ': ' + m : ''));
  }
  const x = await r.text(); return x ? JSON.parse(x) : null;
}
function show(on) { $('login').hidden = on; $('panel').hidden = !on; }
async function login() {
  const m = $('lm'), b = $('go'); m.textContent = '';
  if (!SB || !KEY) { m.textContent = 'لم يتم ربط الموقع بقاعدة البيانات بعد.'; return; }
  b.disabled = true;
  try {
    saveSess(await auth('token?grant_type=password', {email: $('em').value.trim(), password: $('pw').value}));
    $('pw').value = ''; show(true); load();
  } catch (e) { m.textContent = 'بيانات الدخول غير صحيحة.'; }
  setTimeout(() => { b.disabled = false; }, 1500);
}
function logout() {
  sess = null; try { localStorage.removeItem('qa_sess'); } catch (e) {}
  show(false); $('list').replaceChildren();
}
async function load() {
  try { render(await api('products?select=*&order=id')); } catch (e) { say(e.message); }
}
async function uploadImg(file, max = 800) {
  let bmp;
  try { bmp = await createImageBitmap(file); } catch (e) { throw new Error('صيغة الصورة غير مدعومة، استخدم JPG أو PNG'); }
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
  if (!blob || blob.size > 1000000) throw new Error('الصورة كبيرة جداً');
  const name = Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + '.jpg';
  const r = await fetch(SB + '/storage/v1/object/products/' + name, {method: 'POST', headers: {apikey: KEY, Authorization: 'Bearer ' + await token(), 'Content-Type': 'image/jpeg'}, body: blob});
  if (!r.ok) throw new Error('تعذّر رفع الصورة (تأكد من إعداد التخزين)');
  return SB + '/storage/v1/object/public/products/' + name;
}
function row(p) {
  const d = el('div', 'item'), n = el('input'), pr = el('input'), c = el('input'), a = el('input');
  const fld = (label, node) => { const w = el('div', 'f'); w.append(el('label', '', label), node); return w; };
  n.value = p.name || ''; n.maxLength = 80; n.placeholder = 'مثال: بيتزا دجاج';
  pr.type = 'text'; pr.inputMode = 'decimal'; pr.value = p.price || ''; pr.placeholder = 'مثال: 22';
  c.value = p.cat || ''; c.maxLength = 30; c.placeholder = 'مثال: بيتزا'; c.setAttribute('list', 'cl');
  a.type = 'checkbox'; a.checked = p.active !== false; a.style.width = 'auto';
  const chk = el('label', 'chk', ' ظاهر للزبائن'); chk.prepend(a);
  let img = p.image || '';
  const pv = el('img', 'thumb'); pv.alt = ''; pv.hidden = !img; if (img) pv.src = img;
  const f = el('input'); f.type = 'file'; f.accept = 'image/*';
  f.addEventListener('change', async () => {
    const file = f.files[0]; if (!file) return;
    say('جارٍ رفع الصورة...', true);
    try { img = await uploadImg(file); pv.src = img; pv.hidden = false; say('✅ تم رفع الصورة، اضغط حفظ لتثبيتها', true); }
    catch (e) { say(e.message); }
  });
  const rm = el('button', 'btn g', 'إزالة الصورة'); rm.type = 'button';
  rm.addEventListener('click', () => { img = ''; pv.hidden = true; f.value = ''; });
  const imgLine = el('div', 'line'); imgLine.append(pv, f, rm);
  const save = el('button', 'btn', p.id ? 'حفظ التعديل' : 'إضافة الصنف'), acts = el('div', 'acts');
  save.type = 'button';
  save.addEventListener('click', async () => {
    const body = {name: n.value.trim().slice(0, 80), cat: c.value.trim().slice(0, 30), price: toNum(pr.value), active: a.checked, image: img || null};
    if (!body.name) { say('اكتب اسم الصنف'); n.focus(); return; }
    if (!body.cat) { say('اكتب القسم (مثل: بيتزا)'); c.focus(); return; }
    if (!(body.price > 0 && body.price < 10000)) { say('اكتب السعر بالأرقام (مثل 22 أو 7.5)'); pr.focus(); return; }
    save.disabled = true;
    try { await api(p.id ? 'products?id=eq.' + p.id : 'products', {method: p.id ? 'PATCH' : 'POST', body: JSON.stringify(body)}); await load(); say(p.id ? '✅ تم حفظ التعديل' : '✅ تمت إضافة الصنف', true); }
    catch (e) { say(e.message); save.disabled = false; }
  });
  acts.appendChild(save);
  if (p.id) {
    const del = el('button', 'btn d', 'حذف'); del.type = 'button';
    del.addEventListener('click', async () => {
      if (!confirm('حذف هذا الصنف؟')) return;
      try { await api('products?id=eq.' + p.id, {method: 'DELETE'}); await load(); say('تم حذف الصنف', true); } catch (e) { say(e.message); }
    });
    acts.appendChild(del);
  }
  d.append(fld('اسم الصنف', n), fld('السعر (ر.س)', pr), fld('القسم', c), fld('صورة الصنف', imgLine), chk, acts);
  return d;
}
function render(list) {
  const dl = $('cl'); dl.replaceChildren();
  for (const k of new Set(list.map(p => p.cat))) { const o = el('option'); o.value = k; dl.appendChild(o); }
  const b = $('list'); b.replaceChildren(); for (const p of list) b.appendChild(row(p));
}
const FIELDS = [
  ['name', 'اسم المتجر', 60], ['tagline', 'الوصف تحت الاسم (اتركه فارغاً للوصف التلقائي)', 120],
  ['announce', 'إعلان يظهر أعلى الصفحة (اختياري)', 120], ['chips', 'الشارات في الواجهة (افصل بينها بفاصلة)', 120],
  ['phone', 'رقم الواتساب والاتصال (بصيغة 966XXXXXXXXX)', 15], ['address', 'العنوان', 120],
  ['hours', 'أوقات العمل', 120], ['service', 'نوع الخدمة', 160],
  ['ig', 'رابط إنستغرام', 100], ['map', 'رابط الموقع على خرائط قوقل', 200]];
const COLORS = ['#c2410c', '#dc2626', '#15803d', '#1d4ed8', '#7c3aed', '#be185d', '#b45309', '#0f172a'];
let S = {}, imgs = {logo: '', cover: ''}, colorIn = null;
function imgField(k, label, max) {
  const w = el('div', 'f'), line = el('div', 'line');
  const pv = el('img', 'thumb'); pv.alt = ''; pv.hidden = !imgs[k]; if (imgs[k]) pv.src = imgs[k];
  const f = el('input'); f.type = 'file'; f.accept = 'image/*';
  f.addEventListener('change', async () => {
    const file = f.files[0]; if (!file) return;
    say('جارٍ رفع الصورة...');
    try { imgs[k] = await uploadImg(file, max); pv.src = imgs[k]; pv.hidden = false; say('✅ تم رفع الصورة، اضغط حفظ تصميم الموقع', true); }
    catch (e) { say(e.message); }
  });
  const rm = el('button', 'btn g', 'إزالة'); rm.type = 'button';
  rm.addEventListener('click', () => { imgs[k] = ''; pv.hidden = true; f.value = ''; });
  line.append(pv, f, rm); w.append(el('label', '', label), line); return w;
}
function buildSettings() {
  const f = $('sform'); f.replaceChildren();
  imgs = {logo: S.logo || '', cover: S.cover || ''};
  f.append(imgField('logo', 'شعار المتجر (يظهر في الشريط العلوي)', 400), imgField('cover', 'صورة الغلاف (خلفية أعلى الصفحة)', 1200));
  const cw = el('div', 'f'), line = el('div', 'line');
  colorIn = el('input'); colorIn.type = 'color'; colorIn.value = S.color || C.COLOR || '#c2410c';
  for (const c of COLORS) { const b = el('button', 'sw'); b.type = 'button'; b.style.background = c; b.addEventListener('click', () => { colorIn.value = c; }); line.appendChild(b); }
  line.appendChild(colorIn); cw.append(el('label', '', 'لون الموقع الرئيسي'), line); f.appendChild(cw);
  for (const [k, label, max] of FIELDS) {
    const w = el('div', 'f'), i = el('input'); i.id = 's_' + k; i.maxLength = max;
    i.value = typeof S[k] === 'string' ? S[k] : (C[k.toUpperCase()] || '');
    w.append(el('label', '', label), i); f.appendChild(w);
  }
}
async function loadSettings() {
  try { const r = await api('site_settings?select=data&id=eq.1'); S = (r && r[0] && r[0].data) || {}; } catch (e) { S = {}; }
  buildSettings();
}
async function saveSettings() {
  const d = {};
  for (const [k, , max] of FIELDS) d[k] = $('s_' + k).value.trim().slice(0, max);
  d.phone = d.phone.replace(/[٠-٩]/g, x => '٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/\D/g, '');
  d.color = colorIn.value; d.logo = imgs.logo; d.cover = imgs.cover;
  try { await api('site_settings?id=eq.1', {method: 'PATCH', body: JSON.stringify({data: d})}); S = d; say('✅ تم حفظ تصميم الموقع، حدّث صفحة المتجر لرؤيته', true); }
  catch (e) { say(e.message); }
}
function tab(on) {
  $('tabP').hidden = on; $('tabS').hidden = !on;
  $('tp').className = on ? 'btn g' : 'btn'; $('ts').className = on ? 'btn' : 'btn g';
  if (on) loadSettings();
}
async function changePw() {
  const a = $('np').value, b = $('np2').value;
  if (a.length < 12) { say('كلمة المرور يجب ألا تقل عن 12 خانة'); return; }
  if (a !== b) { say('كلمتا المرور غير متطابقتين'); return; }
  try {
    const r = await fetch(SB + '/auth/v1/user', {method: 'PUT', headers: {apikey: KEY, Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json'}, body: JSON.stringify({password: a})});
    if (!r.ok) throw 0;
    $('np').value = $('np2').value = ''; $('pwbox').hidden = true; say('✅ تم تغيير كلمة المرور', true);
  } catch (e) { say('تعذّر التغيير'); }
}
$('tp').addEventListener('click', () => tab(false));
$('ts').addEventListener('click', () => tab(true));
$('ssave').addEventListener('click', saveSettings);
$('go').addEventListener('click', login);
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('out').addEventListener('click', logout);
$('pwb').addEventListener('click', () => { $('pwbox').hidden = !$('pwbox').hidden; });
$('pws').addEventListener('click', changePw);
$('add').addEventListener('click', () => $('list').prepend(row({})));
try { const o = JSON.parse(localStorage.getItem('qa_sess')); if (o && o.a && o.r && SB) { sess = o; show(true); load(); } } catch (e) {}
</script>
</body>
</html>
