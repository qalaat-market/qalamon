<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'sha256-HEoi3WkHV8Vz9yT9763JLMU0mssDLrREd8wVB03YKw8='; connect-src 'self' https://*.supabase.co; img-src 'self' data: https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#c2410c">
<title>مطعم قلمون للفطائر والبيتزا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pri:#c2410c;--pri2:#7c2d12;--soft:#ffedd5;--ac:#f59e0b;--bg:#faf7f5;--sf:#fff;--tx:#2a1d16;--mu:#7a6a60;--bd:#eadfd8}
@media (prefers-color-scheme:dark){:root{--soft:#3a1f12;--bg:#17110d;--sf:#221914;--tx:#f3ebe6;--mu:#b3a299;--bd:#3d2e25}}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',Tahoma,Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);padding-bottom:100px}
nav{position:sticky;top:0;z-index:50;background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;color:var(--pri);font-size:1.05rem;display:flex;align-items:center;gap:8px;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand img{width:32px;height:32px;border-radius:8px;object-fit:cover;flex:none}
.ann{background:var(--pri);color:#fff;text-align:center;padding:8px 12px;font-size:.88rem}
.ann[hidden]{display:none}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:34px 16px 44px;text-align:center}
.hero h1{font-size:1.6rem;font-weight:800;margin-bottom:8px}
.hero p{opacity:.92;font-size:.95rem;margin-bottom:16px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chips a{color:#fff;text-decoration:none}.chips span{background:rgba(255,255,255,.16);padding:6px 12px;border-radius:20px;font-size:.82rem}
.wrap{max-width:980px;margin:-22px auto 0;padding:0 16px}
.tools{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
input,textarea{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;font-size:.95rem;background:var(--bg);color:var(--tx)}
input:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:1px}
.pills{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.pill{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:7px 15px;border-radius:20px;font-size:.86rem;white-space:nowrap;cursor:pointer}
.pill.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;margin-top:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ic{background:var(--soft);font-size:2.6rem;height:130px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.contact{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:22px}
.contact[hidden]{display:none}
.contact h2{font-size:1.05rem;margin-bottom:10px}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtns a{display:block;text-align:center;padding:11px;border-radius:12px;background:var(--soft);color:var(--pri);text-decoration:none;font-weight:700;font-size:.9rem}
.cbtns a.wa{background:#1fa855;color:#fff}
.info{margin-top:12px;font-size:.85rem;color:var(--mu);line-height:1.9}
.cb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1;justify-content:space-between}
.cb small{color:var(--mu);font-size:.75rem}
.cb h3{font-size:.93rem;line-height:1.5}
.price{font-weight:800;color:var(--pri);font-size:1.1rem}
.btn{padding:10px 14px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-weight:700;font-size:.92rem;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.wa{background:#1fa855;width:100%;padding:13px;font-size:1rem}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd);width:100%;margin-top:8px}
.btn.loc{width:100%;background:var(--soft);color:var(--pri)}.btn.loc.ok{background:var(--pri);color:#fff}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:3px}
.step button{width:34px;height:34px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:1.1rem;cursor:pointer}
.step span{font-weight:800}
.bar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--sf);border-top:1px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center}
.bar small{color:var(--mu);font-size:.78rem}
.bar b{display:block;color:var(--pri);font-size:1.2rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.box{background:var(--sf);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.modal{align-items:center;padding:16px}.box{border-radius:20px}}
.box h2{font-size:1.15rem;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.9rem}
.row.t{font-weight:800;color:var(--pri);border:0}
.mini{display:flex;align-items:center;gap:8px}
.mini button{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.f{margin-top:12px}
.f label{display:block;font-size:.85rem;font-weight:700;margin-bottom:5px}
.f em,#ea{display:block;color:#c0392b;font-size:.78rem;font-style:normal;margin-top:4px;min-height:1em}
.note{text-align:center;color:var(--mu);font-size:.78rem;padding:22px 0}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:24px}
</style>
</head>
<body>
<nav><div class="brand" id="brand">قلمون 🍕</div></nav>
<div class="ann" id="ann" hidden></div>
<section class="hero" id="heroSec">
  <h1 id="hname">مطعم قلمون للفطائر والبيتزا</h1>
  <p id="hero">فطائر وبيتزا في حي المصيف - اطلب الآن عبر واتساب</p>
  <div class="chips" id="chips"><span>🍕 فطائر وبيتزا</span><span>📍 شارك موقعك</span><span>💬 الطلب عبر واتساب</span></div>
</section>
<main class="wrap">
  <div class="tools">
    <input id="q" type="search" maxlength="40" placeholder="ابحث عن فطيرة أو بيتزا..." autocomplete="off">
    <div class="pills" id="pills"></div>
  </div>
  <div class="grid" id="grid"></div>
  <section class="contact" id="contact">
    <h2>📞 تواصل معنا</h2>
    <div class="cbtns" id="cbtns"></div>
    <div class="info" id="info"></div>
  </section>
  <p class="note">🔒 لا حاجة لإنشاء حساب. لا نخزن أي بيانات عنك، والطلب يصل المطعم مباشرة عبر واتساب.</p>
</main>
<div class="bar">
  <div><small>الإجمالي</small><b id="total">0.00 ر.س</b></div>
  <button class="btn" id="open">مراجعة الطلب (<span id="count">0</span>)</button>
</div>

<div class="modal" id="m1" hidden><div class="box" role="dialog" aria-modal="true">
  <h2>🛒 مراجعة الطلب</h2>
  <div id="items"></div>
  <div class="f"><label for="n">الاسم</label><input id="n" maxlength="40" autocomplete="name"><em id="en"></em></div>
  <div class="f"><label for="p">رقم الجوال</label><input id="p" type="tel" inputmode="numeric" maxlength="10" placeholder="05XXXXXXXX" autocomplete="tel"><em id="ep"></em></div>
  <div class="f"><label for="a">العنوان (الحي والشارع ورقم البيت)</label><input id="a" maxlength="120" autocomplete="street-address"></div>
  <div class="f"><button class="btn loc" id="loc" type="button">📍 مشاركة موقعي الحالي</button><em id="el"></em></div>
  <em id="ea"></em>
  <div class="f"><label for="t">ملاحظات (اختياري)</label><textarea id="t" rows="2" maxlength="200"></textarea></div>
  <div class="f"><button class="btn wa" id="send">إرسال الطلب عبر واتساب 💬</button></div>
  <button class="btn ghost" data-close>تراجع</button>
</div></div>

<script src="config.js"></script>
<script>
'use strict';
let PRODUCTS = [
  {id:1,name:'فطيرة جبن',cat:'فطائر',price:6},
  {id:2,name:'فطيرة زعتر',cat:'فطائر',price:4},
  {id:3,name:'فطيرة لحم',cat:'فطائر',price:8},
  {id:4,name:'فطيرة سبانخ',cat:'فطائر',price:5},
  {id:5,name:'بيتزا مارغريتا',cat:'بيتزا',price:22},
  {id:6,name:'بيتزا خضار',cat:'بيتزا',price:24},
  {id:7,name:'بيتزا دجاج',cat:'بيتزا',price:28},
  {id:8,name:'بيتزا لحم',cat:'بيتزا',price:30},
  {id:9,name:'بطاطس مقلية',cat:'إضافات',price:8},
  {id:10,name:'سلطة خضراء',cat:'إضافات',price:10},
  {id:11,name:'عصير برتقال',cat:'مشروبات',price:8},
  {id:12,name:'مشروب غازي',cat:'مشروبات',price:3},
  {id:13,name:'مياه',cat:'مشروبات',price:1}
];
const CFG = window.SHOP || {};
let PHONE = String(CFG.PHONE || '').replace(/\D/g, ''), MAX_QTY = 20;
const cart = new Map();
let cat = 'all', lastSend = 0, geo = null;
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
const cents = p => Math.round(p * 100);
const sar = h => (h / 100).toFixed(2) + ' ر.س';
const clean = (s, n) => String(s).replace(/[\u0000-\u001f\u007f<>*_~`]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, n);
const digits = s => s.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g, '');

async function loadProducts() {
  try {
    let d;
    if (CFG.SB_URL && CFG.SB_KEY) {
      try {
        const r = await fetch(CFG.SB_URL + '/rest/v1/products?select=id,name,cat,price,image&active=eq.true&order=id', {headers: {apikey: CFG.SB_KEY}});
        if (r.ok) d = await r.json();
      } catch (e) {}
    }
    if (!d) for (const u of ['api/products', 'products.json']) {
      try { const r = await fetch(u, {cache: 'no-cache'}); if (r.ok) { d = await r.json(); break; } } catch (e) {}
    }
    if (!Array.isArray(d)) return;
    const ok = d.filter(p => p && p.active !== false && Number.isInteger(p.id) && typeof p.name === 'string' && typeof p.cat === 'string' && p.cat.trim() && typeof p.price === 'number' && p.price > 0 && p.price < 10000)
      .map(p => ({id: p.id, name: clean(p.name, 80), cat: clean(p.cat, 30), price: p.price, image: imgOk(p.image) ? p.image : ''}));
    if (ok.length) { PRODUCTS = ok; cart.clear(); if (cat !== 'all' && !cats().includes(cat)) cat = 'all'; renderPills(); renderGrid(); update(); }
  } catch (e) {}
}

const imgOk = u => typeof u === 'string' && !!CFG.SB_URL && u.startsWith(CFG.SB_URL + '/storage/v1/object/public/products/') && !/[\s"'<>]/.test(u);
const cats = () => [...new Set(PRODUCTS.map(p => p.cat))];
function applyAll() {
  PHONE = digits(String(CFG.PHONE || ''));
  const name = CFG.NAME || 'مطعم قلمون للفطائر والبيتزا', rs = document.documentElement.style;
  document.title = name; $('hname').textContent = name;
  const br = $('brand'); br.replaceChildren();
  if (imgOk(CFG.LOGO)) { const im = el('img'); im.src = CFG.LOGO; im.alt = ''; br.appendChild(im); }
  br.appendChild(el('span', '', name));
  $('hero').textContent = CFG.TAGLINE || ((CFG.AREA ? clean(CFG.AREA, 40) + ' - ' : '') + 'اطلب الآن عبر واتساب');
  const an = clean(CFG.ANNOUNCE || '', 120); $('ann').hidden = !an; $('ann').textContent = an;
  const ch = $('chips'); ch.replaceChildren();
  for (const t of String(CFG.CHIPS || '').split(/[،,]/).map(x => clean(x, 30)).filter(Boolean).slice(0, 4)) ch.appendChild(el('span', '', t));
  const c = CFG.COLOR;
  if (/^#[0-9a-fA-F]{6}$/.test(c || '')) {
    const n = parseInt(c.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    rs.setProperty('--pri', c);
    rs.setProperty('--pri2', 'rgb(' + [r, g, b].map(x => Math.round(x * 0.6)).join(',') + ')');
    rs.setProperty('--soft', 'rgba(' + r + ',' + g + ',' + b + ',.14)');
    document.querySelector('meta[name="theme-color"]').content = c;
  }
  const hs = $('heroSec').style;
  if (imgOk(CFG.COVER)) { hs.backgroundImage = 'linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),url("' + CFG.COVER + '")'; hs.backgroundSize = 'cover'; hs.backgroundPosition = 'center'; }
  else hs.backgroundImage = '';
  initContact();
}
async function loadSettings() {
  if (!(CFG.SB_URL && CFG.SB_KEY)) return;
  try {
    const r = await fetch(CFG.SB_URL + '/rest/v1/site_settings?select=data&id=eq.1', {headers: {apikey: CFG.SB_KEY}});
    if (!r.ok) return;
    const row = (await r.json())[0], S = row && row.data;
    if (!S || typeof S !== 'object') return;
    const t = (k, n) => typeof S[k] === 'string' ? clean(S[k], n) : null;
    const u = (k, n) => typeof S[k] === 'string' ? S[k].trim().slice(0, n) : null;
    const ph = u('phone', 15);
    const map = {NAME: t('name', 60), TAGLINE: t('tagline', 120), ANNOUNCE: t('announce', 120), CHIPS: t('chips', 120),
      PHONE: ph === null ? null : digits(ph), ADDRESS: t('address', 120), HOURS: t('hours', 120), SERVICE: t('service', 160),
      IG: u('ig', 100), MAP: u('map', 200), COLOR: u('color', 7), LOGO: u('logo', 300), COVER: u('cover', 300)};
    for (const k in map) if (map[k] !== null) CFG[k] = map[k];
    applyAll();
  } catch (e) {}
}
function initContact() {
  const num = digits(String(CFG.PHONE || '')), box = $('cbtns'); box.replaceChildren(); $('info').replaceChildren(); $('contact').hidden = false;
  const add = (txt, href, cls) => { const a = el('a', cls || '', txt); a.href = href; if (href.startsWith('https')) { a.target = '_blank'; a.rel = 'noopener noreferrer'; } box.appendChild(a); };
  if (num) { add('📞 اتصال', 'tel:+' + num); add('💬 واتساب', 'https://wa.me/' + num, 'wa'); }
  if (/^https:\/\/(maps\.app\.goo\.gl\/|www\.google\.com\/maps)/.test(CFG.MAP || '')) add('📍 الموقع على الخريطة', CFG.MAP);
  if (/^https:\/\/www\.instagram\.com\/[A-Za-z0-9._]+\/?$/.test(CFG.IG || '')) add('📷 إنستغرام', CFG.IG);
  for (const t of [CFG.ADDRESS, CFG.HOURS, CFG.SERVICE]) if (t) $('info').appendChild(el('div', '', clean(t, 160)));
  if (!box.children.length && !$('info').children.length) $('contact').hidden = true;
}
function renderPills() {
  const b = $('pills'); b.replaceChildren();
  for (const k of ['all', ...cats()]) {
    const x = el('button', 'pill' + (k === cat ? ' on' : ''), k === 'all' ? 'الكل' : k); x.type = 'button';
    x.addEventListener('click', () => { cat = k; renderPills(); renderGrid(); });
    b.appendChild(x);
  }
}
function renderGrid() {
  const s = clean($('q').value, 40).toLowerCase();
  const list = PRODUCTS.filter(p => (cat === 'all' || p.cat === cat) && p.name.toLowerCase().includes(s));
  const g = $('grid'); g.replaceChildren();
  if (!list.length) { g.appendChild(el('div', 'empty', 'لا توجد منتجات مطابقة')); return; }
  for (const p of list) {
    const c = el('div', 'card'), body = el('div', 'cb'), top = el('div'), ic = el('div', 'ic');
    if (imgOk(p.image)) { const im = el('img'); im.src = p.image; im.alt = p.name; im.loading = 'lazy'; ic.appendChild(im); } else ic.textContent = '🍽️';
    top.append(el('small', '', p.cat), el('h3', '', p.name));
    const q = cart.get(p.id) || 0;
    let act;
    if (q) {
      act = el('div', 'step');
      const m = el('button', '', '−'), pl = el('button', '', '+'); m.type = pl.type = 'button';
      m.addEventListener('click', () => setQty(p.id, q - 1));
      pl.addEventListener('click', () => setQty(p.id, q + 1));
      act.append(pl, el('span', '', String(q)), m);
    } else {
      act = el('button', 'btn', '+ أضف للسلة'); act.type = 'button';
      act.addEventListener('click', () => setQty(p.id, 1));
    }
    body.append(top, el('div', 'price', sar(cents(p.price))), act);
    c.append(ic, body); g.appendChild(c);
  }
}
function setQty(id, q) {
  q = Math.max(0, Math.min(MAX_QTY, q | 0));
  if (!PRODUCTS.some(p => p.id === id)) return;
  q ? cart.set(id, q) : cart.delete(id);
  update(); renderGrid();
}
function total() { let t = 0; for (const [id, q] of cart) t += cents(PRODUCTS.find(p => p.id === id).price) * q; return t; }
function update() {
  let n = 0; for (const q of cart.values()) n += q;
  $('count').textContent = n; $('total').textContent = sar(total());
  if (!$('m1').hidden) renderItems();
}
function renderItems() {
  const b = $('items'); b.replaceChildren();
  if (!cart.size) { closeAll(); return; }
  for (const [id, q] of cart) {
    const p = PRODUCTS.find(x => x.id === id), r = el('div', 'row'), m = el('div', 'mini');
    const mi = el('button', '', '−'), pl = el('button', '', '+'); mi.type = pl.type = 'button';
    mi.addEventListener('click', () => setQty(id, q - 1));
    pl.addEventListener('click', () => setQty(id, q + 1));
    m.append(pl, el('span', '', String(q)), mi);
    r.append(el('span', '', p.name), m); b.appendChild(r);
  }
  b.appendChild(el('div', 'row t', 'الإجمالي: ' + sar(total())));
}
function closeAll() { $('m1').hidden = true; }
function openOrder() {
  if (!cart.size) return;
  for (const i of ['en', 'ep', 'ea']) $(i).textContent = '';
  $('m1').hidden = false; renderItems();
}
function getLoc() {
  const b = $('loc'), m = $('el'); m.textContent = '';
  if (!navigator.geolocation) { m.textContent = 'المتصفح لا يدعم تحديد الموقع'; return; }
  b.disabled = true; b.textContent = '⏳ جارٍ تحديد موقعك...';
  navigator.geolocation.getCurrentPosition(pos => {
    const la = pos.coords.latitude, lo = pos.coords.longitude;
    if (Number.isFinite(la) && Number.isFinite(lo) && Math.abs(la) <= 90 && Math.abs(lo) <= 180) {
      geo = {la: la.toFixed(6), lo: lo.toFixed(6)};
      b.textContent = '✅ تم تحديد موقعك'; b.classList.add('ok');
    }
    b.disabled = false;
  }, () => {
    b.disabled = false; b.textContent = '📍 مشاركة موقعي الحالي';
    m.textContent = 'تعذّر تحديد الموقع. فعّل الموقع واسمح للمتصفح، أو اكتب العنوان.';
  }, {enableHighAccuracy: true, timeout: 12000, maximumAge: 0});
}
function send() {
  if (!PHONE) { $('ea').textContent = 'رقم واتساب المطعم لم يُضبط بعد'; return; }
  const name = clean($('n').value, 40), phone = digits($('p').value), addr = clean($('a').value, 120), note = clean($('t').value, 200);
  $('en').textContent = name ? '' : 'أدخل اسمك';
  $('ep').textContent = /^05\d{8}$/.test(phone) ? '' : 'رقم الجوال يبدأ بـ 05 ويتكون من 10 أرقام';
  $('ea').textContent = (addr || geo) ? '' : 'اكتب العنوان أو شارك موقعك';
  if (!name || !/^05\d{8}$/.test(phone) || !(addr || geo)) return;
  if (Date.now() - lastSend < 5000) return;
  lastSend = Date.now();
  const btn = $('send'); btn.disabled = true; setTimeout(() => { btn.disabled = false; }, 5000);
  let t = '*طلب جديد - ' + (CFG.NAME || 'المتجر') + '*\n\n👤 *العميل:* ' + name + '\n📞 *الجوال:* ' + phone + '\n';
  if (addr) t += '📍 *العنوان:* ' + addr + '\n';
  if (geo) t += '🗺 *الموقع:* https://www.google.com/maps?q=' + geo.la + ',' + geo.lo + '\n';
  t += '\n🛒 *الأصناف:*\n';
  for (const [id, q] of cart) {
    const p = PRODUCTS.find(x => x.id === id);
    t += '• ' + p.name + ' × ' + q + ' = ' + sar(cents(p.price) * q) + '\n';
  }
  t += '\n💵 *الإجمالي المتوقع:* ' + sar(total()) + '\n';
  if (note) t += '📝 *ملاحظات:* ' + note + '\n';
  const web = 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(t);
  if (/Android/i.test(navigator.userAgent)) {
    // يفتح واتساب العادي (com.whatsapp) وليس واتساب بزنس؛ وإن لم يكن مثبتاً يفتح الرابط العادي
    location.href = 'intent://send/?phone=' + PHONE + '&text=' + encodeURIComponent(t) + '#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
  } else {
    window.open(web, '_blank', 'noopener,noreferrer');
  }
  closeAll();
}
$('q').addEventListener('input', renderGrid);
$('open').addEventListener('click', openOrder);
$('loc').addEventListener('click', getLoc);
$('send').addEventListener('click', send);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeAll));
$('m1').addEventListener('click', e => { if (e.target === $('m1')) closeAll(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
applyAll(); renderPills(); renderGrid(); update(); loadProducts(); loadSettings();
</script>
</body>
</html>
